name: LunaBridge-Paper-Standalone
main: dev.lunabridge.paper.LunaBridgePaperPlugin
version: ${version}
api-version: '26.2'
description: Discord integration for LunaChat standalone authority
author: LunaBridge
depend: [LunaChat]
commands:
  lunabridge:
    description: Configure and diagnose LunaBridge
    usage: /lunabridge <setup|doctor>
    permission: lunabridge.admin
permissions:
  lunabridge.admin:
    default: op
