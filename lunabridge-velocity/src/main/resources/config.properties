# Velocity is the single network and Discord authority in proxy mode.
config-version=1
network.shared-pass=
limits.pending-deliveries=1024
limits.dedup-entries=10000
discord.token=PUT_DISCORD_BOT_TOKEN_HERE
discord.text-commands.enabled=true
discord.commands.players.mode=both
discord.commands.players.text-trigger=!p
discord.notifications.channel-id=
discord.notifications.enable.startup=true
discord.notifications.enable.shutdown=true
discord.notifications.enable.join=true
discord.notifications.enable.quit=true
discord.notifications.enable.first-login=true
discord.notifications.enable.login=true
discord.notifications.enable.server-switch=true
discord.notifications.startup=✅ Server started
discord.notifications.shutdown=⛔ Server stopped
discord.notifications.join=➡️ {{player}} joined
discord.notifications.quit=⬅️ {{player}} left
discord.notifications.first-login=🎉 {{player}} joined {{server}} for the first time
discord.notifications.login=➡️ {{player}} logged in
discord.notifications.server-switch=🔀 {{player}} moved to {{server}}
discord.notifications.first-login-channel-id=
discord.notifications.first-login-role-id=
# One mapping per bridge key. Example: discord.channels.global=123456789012345678
discord.channels.global=
